<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistral – News War Thunder</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red:    #ff0044;
            --purple: #8800ff;
            --rg: rgba(255,0,68,.6);
            --pg: rgba(136,0,255,.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Exo 2', sans-serif;
            background: #07000e;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #cvs { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .blob { position: fixed; border-radius: 50%; filter: blur(110px); opacity: .2; pointer-events: none; z-index: 0; }
        .b1 { width: 600px; height: 600px; background: var(--purple); top: -160px; left: -160px; animation: drift 14s ease-in-out infinite; }
        .b2 { width: 480px; height: 480px; background: var(--red); bottom: -100px; right: -100px; animation: drift 14s ease-in-out infinite reverse; }
        @keyframes drift {
            0%,100% { transform: translate(0,0); }
            40%     { transform: translate(40px,-30px); }
            70%     { transform: translate(-20px,22px); }
        }

        /* NAV */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 200;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 56px; height: 66px;
            background: rgba(7,0,14,.55);
            backdrop-filter: blur(22px);
            border-bottom: 1px solid rgba(255,0,68,.13);
        }
        .nav-logo { display: flex; align-items: center; gap: 11px; text-decoration: none; }
        .nav-logo img { height: 34px; filter: drop-shadow(0 0 9px var(--red)); }
        .nav-logo span {
            font-family: 'Rajdhani', sans-serif; font-size: 21px; font-weight: 700;
            letter-spacing: 4px; text-transform: uppercase;
            background: linear-gradient(90deg, var(--red), var(--purple));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .nav-links { display: flex; gap: 4px; list-style: none; }
        .nav-links a {
            color: rgba(255,255,255,.65); text-decoration: none;
            font-size: 12px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase;
            padding: 7px 15px; border-radius: 6px; transition: color .2s, background .2s;
        }
        .nav-links a:hover { color: #fff; background: rgba(255,0,68,.13); }
        .nav-links a.active { color: #fff; background: rgba(255,0,68,.18); }
        .nav-links .join { color:#fff; background:linear-gradient(135deg,var(--red),var(--purple)); box-shadow:0 0 16px rgba(255,0,68,.4); }
        .nav-links .join:hover { box-shadow:0 0 28px rgba(255,0,68,.6); }

        /* PAGE HEADER */
        .page-hero {
            position: relative; z-index: 1;
            padding: 130px 40px 50px;
            text-align: center;
        }
        .page-hero .tag { font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin-bottom:12px;display:block; }
        .page-hero h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(38px,6vw,68px); font-weight: 700;
            text-transform: uppercase; line-height: 1;
            background: linear-gradient(155deg,#fff 20%,#dd99ff 60%,var(--red) 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .page-hero p { font-size:14px;opacity:.45;letter-spacing:1px; }

        .sep { position:relative;z-index:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,0,68,.35),rgba(136,0,255,.35),transparent);margin-bottom:60px; }

        /* CONTAINER */
        .container { position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 40px 100px; }

        /* NEWS CARD */
        .news-card {
            background: rgba(15,0,25,.6);
            border: 1px solid rgba(255,0,68,.25);
            border-radius: 16px; overflow: hidden;
            margin-bottom: 28px;
            backdrop-filter: blur(18px);
            transition: transform .25s, border-color .25s, box-shadow .25s;
            position: relative;
        }
        .news-card::before {
            content:''; position:absolute; top:0;left:0;right:0;height:2px;
            background:linear-gradient(90deg,var(--red),var(--purple));
            opacity:0; transition:opacity .25s;
        }
        .news-card:hover { transform:translateY(-4px); border-color:rgba(255,0,68,.5); box-shadow:0 8px 40px rgba(136,0,255,.22); }
        .news-card:hover::before { opacity:1; }

        .news-image { width:100%;height:320px;overflow:hidden; }
        .news-image img { width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease; }
        .news-card:hover .news-image img { transform:scale(1.04); }

        .news-body { padding:22px 26px 20px; }

        .news-meta { display:flex;align-items:center;gap:14px;margin-bottom:10px; }
        .news-date { font-size:12px;opacity:.4;letter-spacing:1px; }
        .news-source {
            font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
            padding:3px 10px;border-radius:100px;
            background:rgba(255,0,68,.12);color:var(--red);border:1px solid rgba(255,0,68,.25);
        }

        .news-body h2 {
            font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;
            text-transform:uppercase;line-height:1.2;margin-bottom:10px;letter-spacing:.3px;
        }
        .news-body p { font-size:14px;opacity:.58;line-height:1.7;margin-bottom:18px; }

        .news-footer {
            display:flex;align-items:center;justify-content:space-between;gap:12px;
            padding-top:16px;border-top:1px solid rgba(255,255,255,.06);
        }
        .btn-read {
            font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;
            letter-spacing:2px;text-transform:uppercase;text-decoration:none;
            padding:10px 24px;border-radius:8px;
            background:linear-gradient(135deg,var(--red),var(--purple));color:#fff;
            box-shadow:0 0 18px rgba(255,0,68,.35);
            transition:transform .2s,box-shadow .2s;
        }
        .btn-read:hover { transform:translateY(-2px);box-shadow:0 6px 28px rgba(255,0,68,.55); }

        /* SKELETON */
        .skeleton { background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden;margin-bottom:28px; }
        .sk-img { width:100%;height:240px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite; }
        .sk-body { padding:22px 26px 20px;display:flex;flex-direction:column;gap:10px; }
        .sk-line { height:14px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite; }
        .sk-line.w60{width:60%} .sk-line.w40{width:40%} .sk-line.h22{height:22px}
        @keyframes shimmer { to { background-position:-200% 0; } }

        .error-box { text-align:center;padding:60px 20px;opacity:.45; }
        .error-box .ico { font-size:48px;margin-bottom:16px; }
        .error-box p { font-size:15px;letter-spacing:1px;line-height:1.7; }

        footer {
            position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.06);
            padding:34px 56px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
        }
        .foot-l { display:flex;align-items:center;gap:9px;opacity:.32;font-size:12px;letter-spacing:2px;text-transform:uppercase; }
        .foot-l img { height:20px;filter:drop-shadow(0 0 5px var(--red)); }
        .foot-c { font-size:11px;opacity:.2;letter-spacing:1px; }

        @media(max-width:820px){
            nav{padding:0 18px;} .nav-links{display:none;}
            .page-hero{padding:110px 20px 36px;} .container{padding:0 16px 80px;}
            .news-image{height:200px;} footer{padding:26px 20px;justify-content:center;text-align:center;}
        }
    </style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<canvas id="cvs"></canvas>

<nav>
    <a href="index.html" class="nav-logo">
        <img src="images/logo-mistralv2.png" alt="Mistral">
        <span>Mistral</span>
    </a>
    <ul class="nav-links">
        <li><a href="annonces.html">Annonces</a></li>
        <li><a href="news.html" class="active">News</a></li>
        <li><a href="tss.html">Meta TSS</a></li>
        <li><a href="sqb.html">SQB</a></li>
        <li><a href="recrutement.html" class="join">Rejoindre</a></li>
    </ul>
</nav>

<div class="page-hero">
    <span class="tag">// War Thunder · Steam</span>
    <h1>News officielles</h1>
    <p>Dernières actualités War Thunder depuis Steam</p>
</div>

<div class="sep"></div>

<div class="container" id="container">
    <div class="skeleton"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w40"></div><div class="sk-line h22 w60"></div><div class="sk-line"></div><div class="sk-line w60"></div></div></div>
    <div class="skeleton"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w40"></div><div class="sk-line h22 w60"></div><div class="sk-line"></div><div class="sk-line w60"></div></div></div>
    <div class="skeleton"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w40"></div><div class="sk-line h22 w60"></div><div class="sk-line"></div><div class="sk-line w60"></div></div></div>
</div>

<footer>
    <div class="foot-l">
        <img src="images/logo-mistralv2.png" alt="">
        Mistral
    </div>
    <div class="foot-c">© 2025 Mistral — Tous droits réservés</div>
</footer>

<script>
    /* ── Particles ── */
    const cvs = document.getElementById('cvs');
    const ctx = cvs.getContext('2d');
    function resize(){ cvs.width=innerWidth; cvs.height=innerHeight; }
    addEventListener('resize', resize); resize();
    const pts = Array.from({length:100},()=>({
        x:Math.random()*innerWidth, y:Math.random()*innerHeight,
        r:Math.random()*1.2+.3, vx:(Math.random()-.5)*.2, vy:(Math.random()-.5)*.2,
        a:Math.random()*.35+.06, c:Math.random()>.5?'#ff0044':'#8800ff'
    }));
    function drawPts(){
        ctx.clearRect(0,0,cvs.width,cvs.height);
        pts.forEach(p=>{
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0||p.x>cvs.width||p.y<0||p.y>cvs.height){p.x=Math.random()*cvs.width;p.y=Math.random()*cvs.height;}
            ctx.save(); ctx.globalAlpha=p.a; ctx.fillStyle=p.c; ctx.shadowColor=p.c; ctx.shadowBlur=6;
            ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.restore();
        });
        requestAnimationFrame(drawPts);
    }
    drawPts();

    addEventListener('mousemove', e=>{
        const rx=e.clientX/innerWidth-.5, ry=e.clientY/innerHeight-.5;
        document.querySelectorAll('.blob').forEach((b,i)=>{
            b.style.transform=`translate(${rx*16*(i+1)}px,${ry*10*(i+1)}px)`;
        });
    });

    /* ── Parsing BBCode Steam → HTML (même logique que le contrôleur PHP) ── */
    function parseContent(raw) {
        let c = raw;

        // 1. Remplacer le placeholder Steam
        c = c.replace(/\{STEAM_CLAN_IMAGE\}/g, 'https://clan.akamai.steamstatic.com/images/');

        // 2a. [img src="..."][/img]
        c = c.replace(/\[img\s+src="([^"]+)"\]\[\/img\]/gi, '<img src="$1">');
        // 2b. [img src="..."] sans fermeture
        c = c.replace(/\[img\s+src="([^"]+)"\]/gi, '<img src="$1">');

        // 3. Supprimer les autres balises Steam [xxx]
        c = c.replace(/\[[^\]]*\]/g, '');

        // 4. Strip HTML sauf <img>
        c = c.replace(/<(?!\/?img\b)[^>]+>/gi, '');

        // 5. URLs brutes Akamai restantes → <img>
        c = c.replace(/(https:\/\/clan\.akamai\.steamstatic\.com\/images\/\/[^\s<]+\.(png|jpg|jpeg|gif))/gi, '<img src="$1">');

        // 6. Nettoyer espaces
        c = c.replace(/\s+/g, ' ').trim();

        return c;
    }

    function extractImage(html) {
        const m = html.match(/<img[^>]+src=["']?([^"'\s>]+)["']?/i);
        return m ? m[1] : null;
    }

    function stripTags(html) {
        return html.replace(/<[^>]+>/g, ' ').replace(/\s+/g,' ').trim();
    }

    function truncate(str, n) {
        return str.length > n ? str.slice(0, n).trimEnd() + '…' : str;
    }

    function formatDate(ts) {
        return new Date(ts * 1000).toLocaleDateString('fr-FR', {day:'2-digit', month:'long', year:'numeric'});
    }

    /* ── Fetch Steam API avec proxies en cascade ── */
    const STEAM_URL = 'https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/?appid=236390&count=10&format=json';

    const PROXIES = [
        url => url,                                                              // direct (peut marcher selon le navigateur)
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    ];

    async function fetchSteam() {
        for (const proxy of PROXIES) {
            try {
                const res = await fetch(proxy(STEAM_URL), { signal: AbortSignal.timeout(8000) });
                if (!res.ok) continue;
                const data = await res.json();
                const items = data?.appnews?.newsitems;
                if (items && items.length > 0) return items;
            } catch(e) { /* essaie le proxy suivant */ }
        }
        return null;
    }

    function renderCard(item) {
        const parsed  = parseContent(item.contents);
        const imgSrc  = extractImage(parsed);
        const texte   = truncate(stripTags(parsed), 200);
        const date    = formatDate(item.date);

        const card = document.createElement('div');
        card.className = 'news-card';
        card.style.cssText = 'opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease,border-color .25s,box-shadow .25s';

        card.innerHTML = `
            ${imgSrc ? `<div class="news-image"><img src="${imgSrc}" alt="${item.title}" loading="lazy"></div>` : ''}
            <div class="news-body">
                <div class="news-meta">
                    <span class="news-date">📅 ${date}</span>
                    <span class="news-source">War Thunder</span>
                </div>
                <h2>${item.title}</h2>
                ${texte ? `<p>${texte}</p>` : ''}
                <div class="news-footer">
                    <span></span>
                    <a href="${item.url}" target="_blank" rel="noopener" class="btn-read">Lire l'article →</a>
                </div>
            </div>`;

        return card;
    }

    async function loadNews() {
        const container = document.getElementById('container');
        try {
            const items = await fetchSteam();

            if (!items) {
                container.innerHTML = `<div class="error-box"><div class="ico">⚠️</div><p>Impossible de charger les news.<br>Vérifie ta connexion ou réessaie plus tard.</p></div>`;
                return;
            }

            container.innerHTML = '';

            const obs = new IntersectionObserver(es => es.forEach(e => {
                if (e.isIntersecting) { e.target.style.opacity='1'; e.target.style.transform='translateY(0)'; }
            }), { threshold: .06 });

            items.forEach(item => {
                const card = renderCard(item);
                container.appendChild(card);
                obs.observe(card);
            });

        } catch(err) {
            container.innerHTML = `<div class="error-box"><div class="ico">⚠️</div><p>Impossible de charger les news.<br>Vérifie ta connexion ou réessaie plus tard.</p></div>`;
            console.error(err);
        }
    }

    loadNews();
</script>
</body>
</html>
